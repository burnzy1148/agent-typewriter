name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Jobs only read the repository by default; release adds what it needs to publish.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A PR that changes only the site (site/ and site.yml) skips the extension's
  # jobs and steps below. The test and package jobs still run and pass, so the
  # required checks report under their usual names. Other events always run
  # everything, and so does a missing output: work skips only on an explicit 'false'.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      extension: ${{ steps.classify.outputs.extension }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify changed paths
        id: classify
        # A failure here leaves the output unset, which runs everything.
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # The PR merge commit's first parent is the base branch. --no-renames
            # lists both sides of a rename, so a file moved into site/ still counts.
            # -z gives exact, unquoted paths separated by NUL.
            git diff -z --name-only --no-renames HEAD^1 HEAD | node scripts/ci-changes.mjs
          else
            echo "extension=true" | tee -a "$GITHUB_OUTPUT"
          fi

  # Unit and integration tests run as separate jobs, in parallel, so the
  # integration run is the only long pole. Each skips as a whole for a
  # site-only PR.
  unit:
    name: Unit tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.extension != 'false'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # it/runTest.ts splits its VS Code launches into two groups that share
  # nothing: suite (suite.ts and its reload checks, the long one) and
  # workspaces (the launches with workspaces of their own).
  integration:
    name: Integration tests (${{ matrix.os }}, ${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.extension != 'false'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        group: [suite, workspaces]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache VS Code test download
        uses: actions/cache@v6
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The runner image usually has xvfb already; install it only when missing.
      - name: Install xvfb
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Integration tests
        run: npm run it
        env:
          IT_GROUP: ${{ matrix.group }}

  # The required checks. Each passes when the unit and integration jobs passed,
  # or were skipped because the PR changes only the site; a missing changes
  # output fails it, so nothing passes untested.
  test:
    name: Test (${{ matrix.os }})
    needs: [changes, unit, integration]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check test results
        env:
          EXTENSION: ${{ needs.changes.outputs.extension }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          echo "unit: $UNIT, integration: $INTEGRATION, extension: $EXTENSION"
          for result in "$UNIT" "$INTEGRATION"; do
            [ "$result" = success ] && continue
            [ "$result" = skipped ] && [ "$EXTENSION" = false ] && continue
            exit 1
          done

  # Packaging runs alongside the tests rather than after them: the unit job
  # already typechecks and tests, so this only bundles and packages.
  package:
    name: Package .vsix
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.extension != 'false'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: needs.changes.outputs.extension != 'false'

      # vsce runs vscode:prepublish, the minified build, first.
      - name: Build .vsix
        if: needs.changes.outputs.extension != 'false'
        run: npx vsce package --no-dependencies

      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.extension != 'false'
        with:
          name: agent-typewriter-vsix
          path: '*.vsix'
          if-no-files-found: error

  # A run on a tag like v0.1.0 publishes the tested .vsix to the Marketplace and
  # attaches it to a GitHub release. Pushing a tag doesn't start one, since tags
  # go on develop before the release reaches main: release.yml dispatches it
  # after a release PR merges, or run `gh workflow run ci.yml --ref v<version>`.
  # Needs the VSCE_PAT repository secret.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: agent-typewriter-vsix

      - name: Publish to the Marketplace
        run: npx vsce publish --packagePath *.vsix --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
